# site properties and page defaults
title: Olaf Lab
subtitle: at Hanyang University
description: Sensory Neuroscience Lab at Hanyang University, studying the olfactory system, cognition, emotion, and olfactory dysfunction.
header:
header-dark: false
footer:
footer-dark: false
logo: images/olaf/olaf-lab-logo.png
show-logo: true
logo-text: false
proofer: false

# site social media and other links
links:
  email: seungjun@hanyang.ac.kr
  github: snlab-hyu

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
